<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="chairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Floor Grid -->
  <line x1="60" y1="340" x2="540" y2="340" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" />
  <line x1="60" y1="341" x2="540" y2="341" stroke="#475569" stroke-width="3" />

  <!-- Header Banner -->
  <g transform="translate(30, 24)">
    <rect width="250" height="32" rx="16" fill="rgba(99, 102, 241, 0.2)" stroke="#6366F1" stroke-width="1" />
    <circle cx="16" cy="16" r="6" fill="#10B981" />
    <text x="32" y="21" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Seated Knee Extension Guide</text>
  </g>

  <!-- Side Specs Box -->
  <g transform="translate(420, 30)">
    <rect width="150" height="90" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="14" y="24" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TARGET JOINT</text>
    <text x="14" y="44" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Knee &amp; Quadriceps</text>
    <text x="14" y="64" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">MOTION TYPE</text>
    <text x="14" y="80" fill="#10B981" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Terminal Extension</text>
  </g>

  <!-- Clinical Therapy Chair -->
  <!-- Chair Backrest -->
  <rect x="180" y="160" width="16" height="110" rx="6" fill="url(#chairGrad)" />
  <!-- Chair Seat -->
  <rect x="180" y="260" width="115" height="16" rx="5" fill="url(#chairGrad)" />
  <!-- Chair Legs -->
  <line x1="188" y1="276" x2="188" y2="340" stroke="#475569" stroke-width="8" stroke-linecap="round" />
  <line x1="285" y1="276" x2="285" y2="340" stroke="#475569" stroke-width="8" stroke-linecap="round" />

  <!-- Seated Figure -->
  <!-- Head -->
  <circle cx="215" cy="115" r="22" fill="#E2E8F0" filter="url(#shadow)" />
  <circle cx="215" cy="115" r="22" stroke="#6366F1" stroke-width="3" fill="none" />

  <!-- Neck -->
  <line x1="215" y1="137" x2="215" y2="150" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round" />

  <!-- Torso (Upright against chair) -->
  <line x1="215" y1="150" x2="215" y2="255" stroke="url(#primaryGrad)" stroke-width="18" stroke-linecap="round" />

  <!-- Arms (resting on lap/side of chair) -->
  <path d="M 215 170 L 260 215 L 265 250" stroke="#CBD5E1" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Thigh (Supported on seat) -->
  <line x1="215" y1="255" x2="310" y2="255" stroke="url(#primaryGrad)" stroke-width="18" stroke-linecap="round" />

  <!-- Knee Joint Pivot -->
  <circle cx="310" cy="255" r="10" fill="#10B981" />
  <circle cx="310" cy="255" r="4" fill="#FFFFFF" />

  <!-- Resting Lower Leg Position (Dotted at 90°) -->
  <line x1="310" y1="255" x2="310" y2="335" stroke="#64748B" stroke-width="8" stroke-linecap="round" stroke-dasharray="4 4" />
  <path d="M 305 338 L 330 338" stroke="#64748B" stroke-width="8" stroke-linecap="round" />
  <text x="250" y="315" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Rest (90°)</text>

  <!-- Active Extended Leg (Horizontal extension) -->
  <line x1="310" y1="255" x2="425" y2="255" stroke="#60A5FA" stroke-width="14" stroke-linecap="round" />
  <!-- Extended Foot (Toes pointing upward) -->
  <path d="M 425 255 L 435 235" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round" />

  <!-- Extension Motion Arc -->
  <path d="M 345 320 A 70 70 0 0 0 395 275" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-dasharray="4 3" />
  <!-- Arrow Head -->
  <polygon points="398,268 400,282 388,276" fill="#F59E0B" />

  <!-- Callout: Quadriceps Activation -->
  <g transform="translate(230, 205)">
    <rect width="115" height="24" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1" />
    <text x="57" y="16" text-anchor="middle" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Quad Contraction</text>
  </g>

  <!-- Callout: Full Extension Alignment -->
  <line x1="310" y1="255" x2="470" y2="255" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="4 4" />
  <rect x="420" y="275" width="110" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <text x="475" y="291" text-anchor="middle" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Hold 2-3 Seconds</text>
</svg>
