<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Floor Grid / Reference line -->
  <line x1="60" y1="340" x2="540" y2="340" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" />
  <line x1="60" y1="341" x2="540" y2="341" stroke="#475569" stroke-width="3" />

  <!-- Vertical alignment line -->
  <line x1="285" y1="90" x2="285" y2="340" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Header Banner -->
  <g transform="translate(30, 24)">
    <rect width="180" height="32" rx="16" fill="rgba(99, 102, 241, 0.2)" stroke="#6366F1" stroke-width="1" />
    <circle cx="16" cy="16" r="6" fill="#10B981" />
    <text x="32" y="21" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Squat Demonstration</text>
  </g>

  <!-- Side Indicator / Specs -->
  <g transform="translate(420, 30)">
    <rect width="150" height="90" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="14" y="24" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TARGET JOINTS</text>
    <text x="14" y="44" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Hips &amp; Knees</text>
    <text x="14" y="64" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TARGET ANGLE</text>
    <text x="14" y="80" fill="#10B981" font-family="system-ui, sans-serif" font-size="13" font-weight="700">90° Knee Flexion</text>
  </g>

  <!-- Squatting Figure -->
  <!-- Head -->
  <circle cx="285" cy="120" r="22" fill="#E2E8F0" filter="url(#shadow)" />
  <circle cx="285" cy="120" r="22" stroke="#6366F1" stroke-width="3" fill="none" />

  <!-- Neck -->
  <line x1="285" y1="142" x2="280" y2="155" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round" />

  <!-- Torso (slight natural forward hinge) -->
  <path d="M 280 155 L 235 235" stroke="url(#primaryGrad)" stroke-width="18" stroke-linecap="round" />

  <!-- Spine Alignment Guide -->
  <line x1="290" y1="145" x2="225" y2="245" stroke="#10B981" stroke-width="2" stroke-dasharray="3 3" />
  <text x="160" y="195" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Neutral Spine</text>

  <!-- Left Arm (extended forward for balance) -->
  <path d="M 275 165 L 345 165 L 375 165" stroke="#CBD5E1" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Hips to Knees (Thigh - parallel to floor) -->
  <path d="M 235 235 L 325 240" stroke="url(#primaryGrad)" stroke-width="18" stroke-linecap="round" />

  <!-- Knee to Ankle (Shin) -->
  <path d="M 325 240 L 310 335" stroke="url(#primaryGrad)" stroke-width="16" stroke-linecap="round" />

  <!-- Foot (flat on floor) -->
  <path d="M 298 338 L 340 338" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round" />

  <!-- Knee Joint Marker -->
  <circle cx="325" cy="240" r="10" fill="#10B981" />
  <circle cx="325" cy="240" r="4" fill="#FFFFFF" />

  <!-- Hip Joint Marker -->
  <circle cx="235" cy="235" r="8" fill="#6366F1" />

  <!-- 90 Degree Angle Arc -->
  <path d="M 295 239 A 30 30 0 0 1 321 270" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="2 2" />
  <text x="335" y="270" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="12" font-weight="700">90°</text>

  <!-- Cadence Arrows -->
  <g transform="translate(180, 260)">
    <path d="M 0 0 L 0 35 M -5 25 L 0 35 L 5 25" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" fill="none" />
    <text x="-40" y="55" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Controlled Descent</text>
  </g>

  <!-- Foot Baseline Badge -->
  <rect x="260" y="355" width="130" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <text x="325" y="371" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Heels Flat on Floor</text>
</svg>
