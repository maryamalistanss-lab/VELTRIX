<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Floor Grid -->
  <line x1="60" y1="340" x2="540" y2="340" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" />
  <line x1="60" y1="341" x2="540" y2="341" stroke="#475569" stroke-width="3" />

  <!-- Header Banner -->
  <g transform="translate(30, 24)">
    <rect width="210" height="32" rx="16" fill="rgba(99, 102, 241, 0.2)" stroke="#6366F1" stroke-width="1" />
    <circle cx="16" cy="16" r="6" fill="#10B981" />
    <text x="32" y="21" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Wall Push-Ups Guide</text>
  </g>

  <!-- Side Specs Box -->
  <g transform="translate(420, 30)">
    <rect width="150" height="90" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="14" y="24" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TARGET AREA</text>
    <text x="14" y="44" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Chest &amp; Scapulae</text>
    <text x="14" y="64" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">KINEMATICS</text>
    <text x="14" y="80" fill="#10B981" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Closed-Chain Press</text>
  </g>

  <!-- Physical Wall Boundary (Right side) -->
  <rect x="420" y="80" width="22" height="260" fill="url(#wallGrad)" stroke="#64748B" stroke-width="2" />
  <line x1="420" y1="80" x2="420" y2="340" stroke="#94A3B8" stroke-width="3" />

  <!-- Person In Wall Push-Up Stance -->
  <!-- Head (tilted naturally toward wall) -->
  <circle cx="310" cy="120" r="22" fill="#E2E8F0" filter="url(#shadow)" />
  <circle cx="310" cy="120" r="22" stroke="#6366F1" stroke-width="3" fill="none" />

  <!-- Body Line (Rigid plank incline from head to heel) -->
  <!-- Torso & Hips & Legs in continuous aligned angle -->
  <line x1="305" y1="140" x2="265" y2="230" stroke="url(#primaryGrad)" stroke-width="18" stroke-linecap="round" />
  <line x1="265" y1="230" x2="220" y2="335" stroke="url(#primaryGrad)" stroke-width="16" stroke-linecap="round" />

  <!-- Alignment Guide (Straight Spine) -->
  <line x1="315" y1="125" x2="215" y2="345" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="140" y="240" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Neutral Plank Alignment</text>

  <!-- Feet (toes anchored firmly on floor) -->
  <path d="M 210 338 L 235 338" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round" />

  <!-- Arms Performing Press against Wall -->
  <!-- Shoulder -->
  <circle cx="295" cy="155" r="9" fill="#10B981" />

  <!-- Bent Arm Path (Elbow at ~90-120 flexion, palm on wall) -->
  <path d="M 295 155 L 355 185 L 420 160" stroke="#60A5FA" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Hand Contact on Wall -->
  <ellipse cx="420" cy="160" rx="6" ry="12" fill="#F8FAFC" />

  <!-- Elbow Joint Indicator -->
  <circle cx="355" cy="185" r="8" fill="#F59E0B" />
  <text x="345" y="210" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="11" font-weight="700">45° Flare</text>

  <!-- Push / Pull Cadence Arrows -->
  <g transform="translate(330, 115)">
    <!-- Toward Wall -->
    <path d="M 0 0 L 25 -10 M 15 -14 L 25 -10 L 19 -1" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Away from Wall -->
    <path d="M 25 15 L 0 25 M 10 29 L 0 25 L 6 16" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>
  <text x="310" y="95" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Controlled Press</text>

  <!-- Arm-Length Distance Label -->
  <line x1="220" y1="360" x2="420" y2="360" stroke="#64748B" stroke-width="1.5" />
  <circle cx="220" cy="360" r="3" fill="#64748B" />
  <circle cx="420" cy="360" r="3" fill="#64748B" />
  <text x="320" y="375" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Arm-Length Stance Distance</text>
</svg>
